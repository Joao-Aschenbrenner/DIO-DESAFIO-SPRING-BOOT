spring.application.name=dio-desafio-spring-ai

spring.datasource.url=jdbc:h2:file:./data/budget-ai;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# NVIDIA NIM usa a compatibilidade OpenAI somente para o ChatModel.
# Fonte única da configuração NVIDIA fica em budgetai.ai.*: uma única NVIDIA_API_KEY,
# um único modelo e um único endpoint. O starter OpenAI do Spring AI e o cliente de
# áudio referenciam esses mesmos valores. Não existe segunda chave/provedor.
budgetai.ai.provider=NVIDIA NIM
budgetai.ai.api-key=${NVIDIA_API_KEY:not-configured}
budgetai.ai.model=${NVIDIA_MODEL:nvidia/nemotron-3-nano-omni-30b-a3b-reasoning}
budgetai.ai.base-url=${NVIDIA_BASE_URL:https://integrate.api.nvidia.com}
budgetai.ai.transcription-provider=NVIDIA Nemotron Omni / chat-completions

spring.ai.model.chat=openai
spring.ai.openai.chat.api-key=${budgetai.ai.api-key}
spring.ai.openai.chat.base-url=${budgetai.ai.base-url}
spring.ai.openai.chat.options.model=${budgetai.ai.model}
spring.ai.openai.chat.options.temperature=0.2

# IMPORTANTE: o starter OpenAI também tenta auto-configurar outros modelos.
# Este projeto não usa OpenAI Moderation, embeddings, geração de imagem,
# speech ou TranscriptionModel. Mantemos somente ChatModel ativo.
spring.ai.model.moderation=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.model.embedding=none
spring.ai.model.image=none

# O áudio é enviado diretamente ao mesmo NVIDIA Nemotron Omni por
# /v1/chat/completions, reutilizando budgetai.ai.base-url e budgetai.ai.api-key.

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
server.error.include-message=never
server.error.include-stacktrace=never
