spring.application.name=dio-desafio-spring-ai

# Banco local. O launcher executa a aplicação em %LOCALAPPDATA%\BudgetAI,
# portanto o arquivo fica fora da pasta de instalação.
spring.datasource.url=jdbc:h2:file:./data/budget-ai
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${BUDGETAI_H2_CONSOLE:false}

# Aplicação desktop/local: não expor a API para a rede local.
server.address=127.0.0.1
server.port=8080
server.shutdown=graceful

# NVIDIA NIM usa a compatibilidade OpenAI somente para o ChatModel.
# Uma única credencial, modelo e endpoint NVIDIA para texto, Tool Calling e áudio de entrada.
spring.ai.model.chat=openai
spring.ai.openai.chat.base-url=${NVIDIA_BASE_URL:https://integrate.api.nvidia.com}
spring.ai.openai.chat.api-key=${NVIDIA_API_KEY:not-configured}
spring.ai.openai.chat.options.model=${NVIDIA_MODEL:nvidia/nemotron-3-nano-omni-30b-a3b-reasoning}
spring.ai.openai.chat.options.temperature=0.2

# O starter OpenAI pode auto-configurar vários modelos. O projeto usa somente o
# ChatModel NVIDIA por padrão. TTS OpenAI/Spring AI é opcional e só é habilitado
# pelo launcher quando uma OPENAI_TTS_API_KEY é informada.
spring.ai.model.moderation=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=${BUDGETAI_TTS_PROVIDER:none}
spring.ai.model.embedding=none
spring.ai.model.image=none

# TTS real via Spring AI (opcional). Mantemos a sintaxe options.* compatível com
# Spring AI 2.0.0-M1. Sem chave, a interface usa Web Speech API local como fallback.
spring.ai.openai.audio.speech.api-key=${OPENAI_TTS_API_KEY:not-configured}
spring.ai.openai.audio.speech.options.model=${OPENAI_TTS_MODEL:tts-1}
spring.ai.openai.audio.speech.options.voice=${OPENAI_TTS_VOICE:nova}
spring.ai.openai.audio.speech.options.response-format=mp3
spring.ai.openai.audio.speech.options.speed=1.0

# O áudio de entrada é enviado diretamente ao NVIDIA Nemotron Omni por
# /v1/chat/completions; não existe segunda chave/provedor para transcrição.
budgetai.ai.provider=NVIDIA NIM
budgetai.ai.model=${NVIDIA_MODEL:nvidia/nemotron-3-nano-omni-30b-a3b-reasoning}
budgetai.ai.base-url=${NVIDIA_BASE_URL:https://integrate.api.nvidia.com}
budgetai.ai.transcription-provider=NVIDIA Nemotron Omni / chat-completions

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
server.error.include-message=never
server.error.include-stacktrace=never
