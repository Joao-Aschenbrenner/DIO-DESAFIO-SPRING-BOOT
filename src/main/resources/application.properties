spring.application.name=dio-desafio-spring-ai

spring.datasource.url=jdbc:h2:file:./data/budget-ai;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.audio.transcription.options.model=gpt-4o-mini-transcribe
spring.ai.openai.audio.transcription.options.language=pt

server.error.include-message=always
