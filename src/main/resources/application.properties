spring.application.name=dio-desafio-spring-ai

spring.datasource.url=jdbc:h2:file:./data/budget-ai;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Chat/Tool Calling: NVIDIA NIM por padrão usando a API OpenAI-compatible.
# A chave nunca deve ser commitada; configure NVIDIA_API_KEY no ambiente.
spring.ai.openai.chat.base-url=${NVIDIA_BASE_URL:https://integrate.api.nvidia.com}
spring.ai.openai.chat.api-key=${NVIDIA_API_KEY:not-configured}
spring.ai.openai.chat.options.model=${NVIDIA_MODEL:z-ai/glm-5.2}
spring.ai.model.embedding=none

# Speech-to-text continua isolado do LLM de chat.
# Spring AI usa a Transcription API compatível com OpenAI para este módulo.
# Se OPENAI_API_KEY não estiver configurada, o servidor ainda inicia, mas endpoints de áudio falharão ao chamar o provedor.
spring.ai.openai.audio.transcription.base-url=${OPENAI_AUDIO_BASE_URL:https://api.openai.com}
spring.ai.openai.audio.transcription.api-key=${OPENAI_API_KEY:not-configured}
spring.ai.openai.audio.transcription.options.model=${OPENAI_TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}
spring.ai.openai.audio.transcription.options.language=pt

budgetai.ai.provider=NVIDIA NIM
budgetai.ai.model=${NVIDIA_MODEL:z-ai/glm-5.2}
budgetai.ai.base-url=${NVIDIA_BASE_URL:https://integrate.api.nvidia.com}
budgetai.ai.transcription-provider=OpenAI Audio API

server.error.include-message=always
