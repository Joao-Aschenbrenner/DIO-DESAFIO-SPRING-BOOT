spring.application.name=dio-desafio-spring-ai

# Persistência local. O launcher usa um diretório de dados por usuário no Windows.
spring.datasource.url=jdbc:h2:file:./data/budget-ai;AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# NVIDIA NIM usa a compatibilidade OpenAI somente para o ChatModel.
# A credencial NVIDIA é usada para texto, Tool Calling e áudio de entrada.
spring.ai.model.chat=openai
spring.ai.openai.chat.base-url=${NVIDIA_BASE_URL:https://integrate.api.nvidia.com}
spring.ai.openai.chat.api-key=${NVIDIA_API_KEY:not-configured}
spring.ai.openai.chat.options.model=${NVIDIA_MODEL:nvidia/nemotron-3-nano-omni-30b-a3b-reasoning}
spring.ai.openai.chat.options.temperature=0.2

# Recursos OpenAI não usados pela aplicação principal.
spring.ai.model.moderation=none
spring.ai.model.audio.transcription=none
spring.ai.model.embedding=none
spring.ai.model.image=none

# Text-to-Speech REAL via Spring AI TextToSpeechModel.
# É opcional e usa uma chave separada para não misturar credenciais com a NVIDIA.
# Se BUDGETAI_TTS_API_KEY não estiver configurada, o frontend usa Web Speech API local como fallback.
spring.ai.model.audio.speech=openai
spring.ai.openai.api-key=${BUDGETAI_TTS_API_KEY:not-configured}
spring.ai.openai.audio.speech.options.model=${BUDGETAI_TTS_MODEL:gpt-4o-mini-tts}
spring.ai.openai.audio.speech.options.voice=${BUDGETAI_TTS_VOICE:nova}
spring.ai.openai.audio.speech.options.speed=1.0
spring.ai.openai.audio.speech.options.response-format=mp3

# O áudio de entrada é enviado diretamente ao mesmo NVIDIA Nemotron Omni por /v1/chat/completions.
budgetai.ai.provider=NVIDIA NIM
budgetai.ai.model=${NVIDIA_MODEL:nvidia/nemotron-3-nano-omni-30b-a3b-reasoning}
budgetai.ai.base-url=${NVIDIA_BASE_URL:https://integrate.api.nvidia.com}
budgetai.ai.transcription-provider=NVIDIA Nemotron Omni / chat-completions

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
server.error.include-message=never
server.error.include-stacktrace=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
