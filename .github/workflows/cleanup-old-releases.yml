name: Cleanup Old Releases

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-old-releases.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove old releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.2.0-nvidia --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          gh release delete v0.2.1-windows --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
