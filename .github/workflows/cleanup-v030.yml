name: Cleanup v0.3.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-v030.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove superseded release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.3.0-windows --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
