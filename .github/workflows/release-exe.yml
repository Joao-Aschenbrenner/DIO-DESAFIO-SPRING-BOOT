name: Release Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-exe.yml'
      - 'release/windows/**'
      - 'src/main/**'
      - 'src/test/**'
      - 'build.gradle'

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAG: v0.3.5-windows
      VERSION: 0.3.5
      EXE: BudgetAI-Setup-v0.3.5-Windows-x64.exe

    steps:
      - uses: actions/checkout@v6

      - name: Use preinstalled Java 21 and Gradle
        shell: pwsh
        run: |
          if (-not $env:JAVA_HOME_21_X64) { throw 'JAVA_HOME_21_X64 is not available on this runner' }
          "JAVA_HOME=$env:JAVA_HOME_21_X64" | Out-File $env:GITHUB_ENV -Append
          "$env:JAVA_HOME_21_X64\bin" | Out-File $env:GITHUB_PATH -Append
          $env:JAVA_HOME = $env:JAVA_HOME_21_X64
          $env:PATH = "$env:JAVA_HOME_21_X64\bin;$env:PATH"
          java -version
          if (-not (Get-Command gradle -ErrorAction SilentlyContinue)) { throw 'Preinstalled Gradle was not found' }
          gradle --version

      - name: Test and build
        run: gradle clean test bootJar --no-daemon --warning-mode all

      - name: Compile GUI launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force launcher-classes,package-input | Out-Null
          javac -encoding UTF-8 -Xlint:all -d launcher-classes release/windows/launcher/WindowsLauncher.java
          if ($LASTEXITCODE -ne 0) { throw 'Launcher compilation failed' }
          jar --create --file package-input/launcher.jar --main-class br.com.jaaschenbrenner.budgetai.launcher.WindowsLauncher -C launcher-classes .
          $app = Get-ChildItem build/libs/*.jar | Where-Object { $_.Name -notlike '*-plain.jar' } | Select-Object -First 1
          if (-not $app) { throw 'Spring Boot JAR not found' }
          Copy-Item $app.FullName package-input/budget-ai.jar

      - name: Validate Windows icon
        shell: pwsh
        run: |
          if (-not (Test-Path 'release/windows/budgetai.ico')) { throw 'Custom BudgetAI icon not found' }
          $icon = Get-Item 'release/windows/budgetai.ico'
          if ($icon.Length -lt 1024) { throw 'Custom BudgetAI icon is unexpectedly small' }
          Write-Host "Custom icon ready: $($icon.FullName) ($($icon.Length) bytes)"

      - name: Download bundled Java runtime
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'jre21.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'jre21'
          Invoke-WebRequest 'https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jre/hotspot/normal/eclipse' -OutFile $zip
          Expand-Archive $zip $dir -Force
          $root = Get-ChildItem $dir -Directory | Select-Object -First 1
          if (-not $root) { throw 'JRE not found' }
          "JRE_ROOT=$($root.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Ensure WiX
        shell: pwsh
        run: |
          if (-not (Get-Command light.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory | Where-Object { $_.Name -like 'WiX Toolset*' } | Sort-Object Name -Descending | Select-Object -First 1
            if ($wix) {
              $bin = Join-Path $wix.FullName 'bin'
              $bin | Out-File $env:GITHUB_PATH -Append
              $env:PATH = "$bin;$env:PATH"
            }
          }
          where.exe light.exe

      - name: Build installer EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          jpackage --type exe --name BudgetAI --app-version $env:VERSION --vendor 'Joao Aschenbrenner - DIO' --description 'Assistente financeiro DIO com Spring AI e NVIDIA NIM' --icon 'release/windows/budgetai.ico' --input package-input --main-jar launcher.jar --main-class br.com.jaaschenbrenner.budgetai.launcher.WindowsLauncher --runtime-image $env:JRE_ROOT --dest dist --win-dir-chooser --win-menu --win-shortcut --win-per-user-install
          if ($LASTEXITCODE -ne 0) { throw 'jpackage failed' }
          $generated = Get-ChildItem dist/*.exe | Select-Object -First 1
          if (-not $generated) { throw 'EXE not generated' }
          Copy-Item $generated.FullName $env:EXE
          $hash = (Get-FileHash $env:EXE -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:EXE" | Out-File "$env:EXE.sha256" -Encoding ascii
          Write-Host "SHA256=$hash"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --target $env:GITHUB_SHA --title 'Budget AI v0.3.5 - Delivery Candidate' --prerelease --notes 'Candidato de entrega DIO. Redesign completo e responsivo com fluxo de voz como ação principal, resultados legíveis, valores em reais e detalhes técnicos recolhíveis. Corrige contratos de categorias e Tool Calling, adiciona validações de domínio, tratamento de erros ampliado, servidor restrito a 127.0.0.1, H2 Console desligado por padrão e hardening do upload NVIDIA. Adiciona TextToSpeechModel opcional via Spring AI/OpenAI retornando MP3, mantendo Web Speech API local como fallback. Launcher simplificado, Java 21 embutido e ícone próprio Budget AI.'
          }
          gh release upload $env:TAG $env:EXE "$env:EXE.sha256" --clobber
