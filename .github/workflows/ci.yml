name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Use preinstalled Java 21
        shell: bash
        run: |
          if [ -z "${JAVA_HOME_21_X64:-}" ]; then
            echo "JAVA_HOME_21_X64 is not available on this runner" >&2
            exit 1
          fi
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version

      - name: Verify Gradle
        run: gradle --version

      - name: Test
        run: gradle clean test --no-daemon --warning-mode all
